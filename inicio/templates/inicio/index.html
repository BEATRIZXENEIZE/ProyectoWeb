<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Programación</title>
    <!-- Fuente moderna: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-main);
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            margin-bottom: 1.25rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 1.75rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-container {
            margin-bottom: 2rem;
        }

        .btn-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--accent-gradient);
            color: #0f172a;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 0.85rem 1.85rem;
            border-radius: 14px;
            text-decoration: none;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.35);
            transition: all 0.25s ease;
        }

        .btn-cta:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 18px 35px -5px rgba(56, 189, 248, 0.5);
        }

        .btn-cta svg {
            width: 22px;
            height: 22px;
        }

        .image-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
            aspect-ratio: 16 / 9;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .image-wrapper:hover img {
            transform: scale(1.03);
        }

        .footer-note {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .footer-note span {
            color: var(--accent-color);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="badge">Django + Python</div>
        <h1>Bienvenido a Programación</h1>
        <p class="subtitle">
            Tu entorno de desarrollo está listo. Accede a la gestión de docentes mediante el módulo ABM.
        </p>

        <!-- Botón de acceso a la Gestión de Profesores -->
        <div class="cta-container">
            <a href="{% url 'profesores_list' %}" class="btn-cta">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
                </svg>
                Gestión de Profesores
            </a>
        </div>

        <div class="image-wrapper">
            <img 
                src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=1200&auto=format&fit=crop" 
                alt="Laptop mostrando código de programación"
                loading="lazy"
            />
        </div>

        <p class="footer-note">
            Servidor configurado en <span>miproyecto</span> &bull; Plantilla: <span>inicio/templates/inicio/index.html</span>
        </p>
    </main>
</body>
</html>
